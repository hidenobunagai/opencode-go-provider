name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --ignore-scripts
      - name: Supply chain scan (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --lockfile bun.lock
      - run: bun run lint
      - run: bun run compile
      - run: bun run test -- --runInBand --coverage
      - name: Check Pi sync
        run: bun run sync:pi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
      - run: bun run package:vsix
