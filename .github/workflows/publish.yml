name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run package:vsix
      # A manual run validates the build; only a v* tag may publish. Without this
      # guard `workflow_dispatch` from main would re-publish the version already
      # on the Marketplace and fail with "already exists".
      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # bunx uses the repo's pinned @vscode/vsce, the same tool
        # `bun run package:vsix` builds the VSIX with.
        run: bunx vsce publish --packagePath *.vsix -p "$VSCE_PAT"
      # No Open VSX step: this extension only registers a GitHub Copilot Chat
      # model provider (`languageModelChatProviders`), and Copilot Chat does not
      # exist in the editors Open VSX serves, so a listing there cannot work.
